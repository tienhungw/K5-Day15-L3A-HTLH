# Dùng chung mạng Docker với sc01-caddy-1 trên ovps để Caddy proxy /htlh/* tới htlh-tutor:8085.
services:
  htlh-tutor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: htlh-tutor
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8085"
      MAX_QUERY_CHARS: "400"
      RATE_LIMIT_MAX: "10"
      RATE_LIMIT_WINDOW: "60"
      CORS_ORIGIN: "*"
    networks:
      - sc01_net

networks:
  sc01_net:
    external: true
    name: sc01_sc01_internal
